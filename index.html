      // ═══════════ PRETTIER ═══════════
      function fmt(code) {
        try {
          if (typeof prettier === "undefined")
            return { ok: false, err: "prettier not loaded" };
          const plugins = [];
          if (typeof prettierPlugins !== "undefined" && prettierPlugins.babel)
            plugins.push(prettierPlugins.babel);
          if (!plugins.length)
            return { ok: false, err: "babel plugin missing" };
          return {
            ok: true,
            code: prettier.format(code, {
              parser: "babel",
              plugins,
              printWidth: 80,
              tabWidth: 2,
              singleQuote: true,
              trailingComma: "es5",
              semi: true,
            }),
          };
        } catch (e) {
          return { ok: false, err: e.message };
        }
      }

      // ═══════════ WORKER ═══════════
      function getWkUrl() {
        if (!wkBlob) {
          const src = document.getElementById("wk").textContent;
          wkBlob = URL.createObjectURL(
            new Blob([src], { type: "application/javascript" }),
          );
        }
        return wkBlob;
      }
      function runWorker(sol, spec) {
        return new Promise((res) => {
          const w = new Worker(getWkUrl());
          const tid = setTimeout(() => {
            w.terminate();
            res({ error: "TIMEOUT (10s)", suites: {}, total: 10000 });
          }, 10000);
          w.onmessage = (e) => {
            clearTimeout(tid);
            w.terminate();
            res(e.data);
          };
          w.onerror = (e) => {
            clearTimeout(tid);
            w.terminate();
            res({ error: "Worker: " + e.message, suites: {}, total: 0 });
          };
          w.postMessage({ sol, spec });
        });
      }

      // ═══════════ FONT SIZE ═══════════
      function applyFZ() {
        if (editor) editor.updateOptions({ fontSize: _fz });
        const el = document.getElementById("fz-val");
        if (el) el.textContent = _fz;
        localStorage.setItem(FZ_KEY, _fz);
      }
      function changeFZ(delta) {
        _fz = Math.min(FZ_MAX, Math.max(FZ_MIN, _fz + delta));
        applyFZ();
      }

      // ═══════════ STRICT MODE ═══════════
      function toggleStrict() {
        if (_strictLocked) return;
        _strictOn = !_strictOn;
        updateStrictUI();
        playClick();
      }
      function updateStrictUI() {
        const g = document.getElementById("strict-grp");
        const c = document.getElementById("strict-chk");
        if (!g || !c) return;
        g.classList.toggle("strict-on", _strictOn);
        g.classList.toggle("strict-locked", _strictLocked);
        c.textContent = _strictOn ? "✓" : "";
        g.title = _strictLocked
          ? "STRICT MODE locked — required by this task"
          : `STRICT MODE ${_strictOn ? "ON" : "OFF"}: compare timing vs reference (±${(STRICT_TOLERANCE * 100).toFixed(0)}%)`;
      }

      // ═══════════ MOBILE RESULTS SHEET ═══════════
      function isMobile() {
        return window.innerWidth <= 680;
      }
      function openMobResults() {
        if (isMobile())
          document.getElementById("res-panel").classList.add("mob-open");
      }
      function closeMobResults() {
        document.getElementById("res-panel").classList.remove("mob-open");
      }

      // ═══════════ FORMAT & RUN ═══════════
      async function formatAndRun() {
        if (!curTask || view !== "task") return;
        const key = `${curCat().id}/${curTask.id}`;
        const files = FILECACHE[key];
        if (!files) {
          setStatus("⚠ Files not loaded", "err");
          return;
        }
        playRunStart();
        if (curTab !== "ed") switchTab("ed");
        const btn = document.getElementById("run-btn");
        btn.classList.add("go");
        btn.textContent = "⟳ RUNNING";
        let code = editor ? editor.getValue() : solCode;
        setStatus("⟳ Formatting...");
        const f = fmt(code);
        if (f.ok) {
          code = f.code;
          solCode = code;
          CODE[key] = code;
          _editorLoading = true;
          if (editor) {
            const pos = editor.getPosition();
            editor.setValue(code);
            if (pos) editor.setPosition(pos);
          }
          _editorLoading = false;
          setStatus("✓ Formatted", "ok");
        } else {
          setStatus("⚠ Format skipped: " + f.err.split("\n")[0], "err");
        }
        document.getElementById("res-body").innerHTML =
          `<div class="res-empty"><div style="font-size:1.2rem;animation:blk .36s infinite alternate">⟳</div><div>EXECUTING...</div></div>`;
        document.getElementById("res-sum").innerHTML = "";
        const r = await runWorker(code, files.spec);

        // ── Strict mode: multi-run benchmark ──────────────────────────
        let benchData = null;
        if (_strictOn && files.sol && !r.error) {
          const MAX_RUNS = 100,
            TIME_LIMIT = 5000;
          setStatus("⚡ STRICT — benchmarking reference…");
          btn.textContent = "⟳ REF";
          benchData = await runBenchmark(
            files.sol,
            code,
            files.spec,
            MAX_RUNS,
            TIME_LIMIT,
            () => {
              setStatus("⚡ STRICT — benchmarking your solution…");
              btn.textContent = "⟳ USR";
            },
          );
        }

        btn.classList.remove("go");
        btn.textContent = "▶ RUN";
        renderResults(r, benchData);
        openMobResults();
        if (!r.error) {
          const all = Object.values(r.suites).flat();
          const st =
            all.length > 0 && all.every((t) => t.status === "pass")
              ? "ok"
              : all.some((t) => t.status !== "pass")
                ? "ng"
                : "";
          if (st) STATUS[key] = st;
          if (st === "ok") playAllPass();
          else if (st === "ng") playFail();
        } else playError();
        setStatus("");
      }

      // ── Multi-run benchmark dispatcher ──────────────────────────────
      function runBenchmark(
        refSol,
        userSol,
        spec,
        maxRuns,
        timeLimit,
        onUserPhase,
      ) {
        return new Promise((res) => {
          const w = new Worker(getWkUrl());
          const dead = setTimeout(
            () => {
              w.terminate();
              res(null);
            },
            timeLimit * 2 + 4000,
          );
          w.onmessage = (e) => {
            const d = e.data;
            if (!d || d.error) {
              clearTimeout(dead);
              w.terminate();
              res(null);
              return;
            }
            if (d.type === "ref_done") {
              onUserPhase && onUserPhase();
              return;
            }
            if (d.type === "bench_done") {
              clearTimeout(dead);
              w.terminate();
              res({
                userMinTime: d.userMinTime,
                userRuns: d.userRuns,
                refMinTime: d.refMinTime,
                refRuns: d.refRuns,
              });
            }
          };
          w.onerror = () => {
            clearTimeout(dead);
            w.terminate();
            res(null);
          };
          w.postMessage({
            mode: "benchmark",
            sol: userSol,
            refSol,
            spec,
            maxRuns,
            timeLimit,
          });
        });
      }

      // ═══════════ RENDER ═══════════
      function renderResults(r, benchData) {
        const body = document.getElementById("res-body"),
          sum = document.getElementById("res-sum");
        if (r.error) {
          body.innerHTML = `<div style="padding:11px"><div style="color:#dc322f;font-family:'JetBrains Mono',monospace;font-size:.74rem;border-left:2px solid #dc322f;padding-left:9px"><div style="margin-bottom:3px;color:#cb4b16">⚠ ERROR</div><div style="white-space:pre-wrap;color:#a93020">${esc(r.error)}</div></div></div>`;
          sum.innerHTML = `<span class="bf">✗ ERROR</span>`;
          return;
        }
        const suites = r.suites || {},
          all = Object.values(suites).flat();
        const pass = all.filter((t) => t.status === "pass").length,
          fail = all.filter((t) => t.status !== "pass").length;
        const mems = all.map((t) => t.mem).filter((m) => m != null);
        const totalMem = mems.length ? mems.reduce((a, b) => a + b, 0) : null;
        const memStr = totalMem != null ? fmtB(totalMem) : "";

        // Strict banner (STRICT_TOLERANCE = 10%)
        let strictBanner = "";
        if (_strictOn && benchData) {
          const { userMinTime, userRuns, refMinTime, refRuns } = benchData;
          const TOLS = 0.1; // 10% tolerance
          const ratio =
            refMinTime > 0 ? (userMinTime - refMinTime) / refMinTime : 0;
          const ok = ratio <= TOLS;
          const color = ok ? "#859900" : "#dc322f";
          strictBanner = `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:5px 9px 6px;font-family:'JetBrains Mono',monospace;font-size:.64rem;border-bottom:1px solid var(--bd);flex-shrink:0;background:rgba(0,0,0,.2)">
      <span style="color:${color};font-weight:bold;letter-spacing:.08em">⚡ ${ok ? "STRICT PASS" : "STRICT FAIL"}</span>
      <span style="color:var(--txd)">user min:</span><span style="color:${color}">${userMinTime.toFixed(3)}ms ×${userRuns}</span>
      <span style="color:var(--txd)">ref min:</span><span style="color:#2aa198">${refMinTime.toFixed(3)}ms ×${refRuns}</span>
      <span style="color:var(--txd)">delta:</span><span style="color:${color}">${ratio >= 0 ? "+" : ""}${(ratio * 100).toFixed(1)}% (limit +${(TOLS * 100).toFixed(0)}%)</span>
    </div>`;
        } else if (
          _strictOn &&
          !benchData &&
          files &&
          FILECACHE[`${curCat().id}/${curTask.id}`]?.sol == null
        ) {
          strictBanner = `<div style="padding:4px 9px;font-family:'JetBrains Mono',monospace;font-size:.64rem;color:var(--txd);border-bottom:1px solid var(--bd)">⚡ STRICT: no .sol.js found — skipped</div>`;
        }

        sum.innerHTML = `<span class="bp">✓ ${pass}</span>${fail ? `<span class="bf"> ✗ ${fail}</span>` : ""}<span class="bt">${(r.total || 0).toFixed(2)}ms</span>${memStr ? `<span class="bt" style="color:#2aa198">${memStr}</span>` : ""}`;
        if (!all.length) {
          body.innerHTML =
            strictBanner +
            `<div class="res-empty"><div>NO TESTS FOUND</div></div>`;
          return;
        }
        let h = "";
        Object.entries(suites).forEach(([sn, tests]) => {
          if (!tests?.length) return;
          h += `<div class="r-suite">`;
          if (sn !== "__root__")
            h += `<div class="r-suite-nm">${esc(sn)}</div>`;
          tests.forEach((t) => {
            const memD =
              t.mem != null ? (t.mem >= 0 ? "+" : "") + fmtB(t.mem) : "";
            const asts = t.assertions || [];
            const astFail = asts.filter((a) => a.status === "fail").length;
            const hasAsts = asts.length > 0;
            // expand indicator
            const ico =
              t.status === "pass" ? "●" : t.status === "error" ? "⚠" : "✗";
            let expandLabel = "";
            if (hasAsts) {
              const all = asts.length;
              if (t.status === "pass")
                expandLabel = `<span class="r-expand">${all} ✓ ▸</span>`;
              else if (t.status === "fail")
                expandLabel = `<span class="r-expand">${astFail}/${all} failed ▸</span>`;
            }
            // assertion rows
            let astHtml = "";
            if (hasAsts) {
              astHtml = '<div class="r-assertions">';
              asts.forEach((a) => {
                const gotPart =
                  a.received !== undefined
                    ? `<span class="r-a-sep">→ received</span><span class="r-a-got">${esc(a.received)}</span>`
                    : "";
                const expPart =
                  a.expected !== undefined && a.status === "fail"
                    ? `<span class="r-a-sep">expected</span><span class="r-a-exp">${esc(a.expected)}</span>`
                    : "";
                astHtml += `<div class="r-assert ${a.status}">
                  <span class="r-a-ico">${a.status === "pass" ? "✓" : "✗"}</span>
                  <span class="r-a-matcher">.${esc(a.matcher)}</span>
                  ${expPart}${gotPart}
                </div>`;
              });
              // runtime error if any
              if (t.error && t.status === "error")
                astHtml += `<div class="r-assert fail"><span class="r-a-ico">⚠</span><span style="color:#dc322f">${esc(t.error)}</span></div>`;
              astHtml += "</div>";
            } else if (t.error) {
              astHtml = `<div class="r-err">${esc(t.error)}</div>`;
            }
            h += `<div class="r-item ${t.status}" onclick="this.classList.toggle('open')"><div class="r-nr">
              <span class="r-ico">${ico}</span><span class="r-nm">${esc(t.name)}</span>
              <span class="r-ms">${t.time.toFixed(2)}ms</span>
              ${memD ? `<span class="r-mem" style="color:#2aa198">${memD}</span>` : ""}
              ${expandLabel}
            </div>${astHtml}</div>`;
          });
          h += `</div>`;
        });
        body.innerHTML = strictBanner + h;
      }
      function clearResults() {
        document.getElementById("res-body").innerHTML =
          `<div class="res-empty"><div class="ico">⬡</div><div>AWAITING EXECUTION</div><button onclick="formatAndRun()" class="run-btn" style="margin-top:18px;font-size:.85rem;padding:10px 36px;letter-spacing:.25em;box-shadow:0 0 18px rgba(0,255,255,.2)">▶ RUN</button></div>`;
        document.getElementById("res-sum").innerHTML = "";
      }
      function setStatus(msg, cls = "") {
        const el = document.getElementById("statusbar");
        el.textContent = msg;
        el.className = "statusbar" + (cls ? " " + cls : "");
      }
      function esc(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
      function fmtB(b) {
        if (Math.abs(b) < 1024) return b + "B";
        if (Math.abs(b) < 1048576) return (b / 1024).toFixed(1) + "KB";
        return (b / 1048576).toFixed(1) + "MB";
      }

      // ═══════════ URL ROUTING (query params) ═══════════
      // Works on any base path including GitHub Pages subfolders.
      // ?cat=regex           → open category
      // ?cat=regex&task=ex1  → open specific task

      function setQueryParams(params) {
        const url = new URL(location.href);
        // Clear all first, then set new ones
        [...url.searchParams.keys()].forEach((k) => url.searchParams.delete(k));
        Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
        history.pushState({}, "", url.toString());
      }

      function clearQueryParams() {
        const url = new URL(location.href);
        [...url.searchParams.keys()].forEach((k) => url.searchParams.delete(k));
        history.pushState({}, "", url.toString());
      }

      // Recursively find a node by id in MENU tree
      function findNode(id, nodes) {
        for (const n of nodes) {
          if (n.id === id) return n;
          if (n.children) {
            const found = findNode(id, n.children);
            if (found) return found;
          }
        }
        return null;
      }

      // Find a task by id anywhere in a node's tasks + children
      function findTask(taskId, node) {
        for (const t of node.tasks || []) {
          if (t.id === taskId) return t;
        }
        for (const child of node.children || []) {
          const found = findTask(taskId, child);
          if (found) return found;
        }
        return null;
      }

      async function restoreRoute() {
        const p = new URLSearchParams(location.search);
        const catId = p.get("cat");
        const taskId = p.get("task");
        if (!catId) return;

        const cat = findNode(catId, MENU);
        if (!cat) return;

        if (taskId) {
          const task = findTask(taskId, cat);
          if (task) {
            openCat(cat);
            await openTask(cat, task);
            return;
          }
        }
        openCat(cat);
      }

      // Browser back/forward
      window.addEventListener("popstate", async () => {
        const p = new URLSearchParams(location.search);
        const catId = p.get("cat");
        const taskId = p.get("task");
        if (!catId) {
          navStack = [];
          showView("home");
          return;
        }
        const cat = findNode(catId, MENU);
        if (!cat) {
          showView("home");
          return;
        }
        if (taskId) {
          const task = findTask(taskId, cat);
          if (task) {
            openCat(cat);
            await openTask(cat, task);
            return;
          }
        }
        navStack = [cat];
        openCat(cat);
      });

      // ═══════════ KEYBOARD ═══════════
      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "s") {
          e.preventDefault();
          if (TEST_ON_SAVE && view === "task") formatAndRun();
          return;
        }

        if (e.key === "Escape") {
          if (!document.getElementById("modal").classList.contains("hide")) {
            closeModal();
            return;
          }
          if (view === "task") {
            playClick();
            document.getElementById("bk-task").click();
            return;
          }
          if (view === "category") {
            playClick();
            showView("home");
            return;
          }
          return;
        }

        // F → focus search (home view only, when not already in input)
        if (
          (e.key === "f" || e.key === "F") &&
          view === "home" &&
          e.target !== document.getElementById("srch") &&
          !e.ctrlKey &&
          !e.metaKey
        ) {
          e.preventDefault();
          document.getElementById("srch").focus();
          return;
        }

        // Don't intercept when typing in search or editor
        if (e.target === document.getElementById("srch")) return;
        if (
          view === "task" &&
          document.activeElement &&
          document.getElementById("monaco").contains(document.activeElement)
        )
          return;

        const isUp = e.key === "ArrowUp" || e.key === "w" || e.key === "W";
        const isDown = e.key === "ArrowDown" || e.key === "s" || e.key === "S";
        const isLeft = e.key === "ArrowLeft" || e.key === "a" || e.key === "A";
        const isRight =
          e.key === "ArrowRight" || e.key === "d" || e.key === "D";
        const isEnter = e.key === "Enter";

        if (view === "home") {
          const cards = document
            .getElementById("cat-grid")
            .querySelectorAll(".cat-card");
          if (!cards.length) return;
          const cols = 3,
            max = cards.length - 1;
          if (isRight) {
            e.preventDefault();
            focusCatIdx = Math.min(focusCatIdx + 1, max);
          } else if (isLeft) {
            e.preventDefault();
            focusCatIdx = Math.max(focusCatIdx - 1, 0);
          } else if (isDown) {
            e.preventDefault();
            focusCatIdx = Math.min(focusCatIdx + cols, max);
          } else if (isUp) {
            e.preventDefault();
            focusCatIdx = Math.max(focusCatIdx - cols, 0);
          } else if (isEnter && focusCatIdx >= 0) {
            e.preventDefault();
            cards[focusCatIdx].click();
            return;
          } else return;
          if (focusCatIdx < 0) focusCatIdx = 0;
          cards.forEach((c, i) =>
            c.classList.toggle("focused", i === focusCatIdx),
          );
          cards[focusCatIdx].scrollIntoView({ block: "nearest" });
          return;
        }
        if (view === "category") {
          const rows = document
            .getElementById("task-list")
            .querySelectorAll(".task-row");
          if (!rows.length) return;
          if (isDown || isRight) {
            e.preventDefault();
            focusTaskIdx = Math.min(focusTaskIdx + 1, rows.length - 1);
          } else if (isUp || isLeft) {
            e.preventDefault();
            focusTaskIdx = Math.max(focusTaskIdx - 1, 0);
          } else if (isEnter && focusTaskIdx >= 0) {
            e.preventDefault();
            rows[focusTaskIdx].click();
            return;
          } else return;
          if (focusTaskIdx < 0) focusTaskIdx = 0;
          rows.forEach((r, i) =>
            r.classList.toggle("focused", i === focusTaskIdx),
          );
          rows[focusTaskIdx].scrollIntoView({ block: "nearest" });
          return;
        }
      });
    </script>
  </body>
</html>
