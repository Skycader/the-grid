<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRID::RUNNER</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000810'/%3E%3Crect x='2' y='2' width='28' height='28' rx='1' stroke='%2300ffff' stroke-width='1.5' fill='none'/%3E%3Ccircle cx='16' cy='16' r='5' stroke='%2300ffff' stroke-width='1.5' fill='none'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%2300ffff'/%3E%3Cline x1='4' y1='16' x2='28' y2='16' stroke='%2300ffff' stroke-width='1' opacity='.35'/%3E%3Cline x1='16' y1='4' x2='16' y2='28' stroke='%2300ffff' stroke-width='1' opacity='.35'/%3E%3C/svg%3E"
    />
    <link href="assets/fonts.css" rel="stylesheet" />
    <script src="assets/prettier-standalone.js"></script>
    <script src="assets/prettier-parser-babel.js"></script>
    <script src="assets/monaco/vs/loader.js"></script>
    <script src="menu.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --c: #00ffff;
        --cd: #00aaaa;
        --cm: #004455;
        --bg: #002b36;
        --bg2: #073642;
        --bd: rgba(0, 255, 255, 0.18);
        --tx: #839496;
        --txd: #405c64;
        --glow: 0 0 10px rgba(0, 255, 255, 0.45);
        --glowb:
          0 0 20px rgba(0, 255, 255, 0.8), 0 0 45px rgba(0, 255, 255, 0.28);
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #001a22;
        color: var(--tx);
        font-family: "JetBrains Mono", monospace;
        overflow: hidden;
        cursor: crosshair;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.04) 2px,
          rgba(0, 0, 0, 0.04) 4px
        );
        pointer-events: none;
        z-index: 9999;
      }

      /* ── GLOBAL SCROLLBAR ── */
      ::-webkit-scrollbar {
        width: 3px;
        height: 3px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 20, 30, 0.8);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 180, 220, 0.38);
        border-radius: 0;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 220, 255, 0.62);
      }

      #bg {
        position: fixed;
        inset: 0;
        z-index: 0;
      }
      #app {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
      }
      .view {
        display: none;
        flex: 1;
        flex-direction: column;
        overflow: hidden;
      }
      .view.active {
        display: flex;
      }

      /* ── BOOT ── */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 500;
        background: #000810;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 4px;
        transition: opacity 0.6s;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      .boot-line {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.72rem;
        color: var(--cd);
        letter-spacing: 0.1em;
        opacity: 0;
        animation: btIn 0.1s forwards;
      }
      @keyframes btIn {
        to {
          opacity: 1;
        }
      }
      #boot-logo {
        font-family: "Orbitron", sans-serif;
        font-size: 2.2rem;
        font-weight: 900;
        color: var(--c);
        text-shadow: var(--glowb);
        letter-spacing: 0.2em;
        margin-bottom: 14px;
        opacity: 0;
      }

      /* ── HOME ── */
      /* overflow-y on the view; margin:auto on content for vertical centering.
   When content < viewport → auto margins split space → true center.
   When content > viewport (search results) → margins collapse → scrollable from top. */
      #view-home {
        align-items: center;
        overflow-y: auto;
        padding: 0;
      }
      .home-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 11px;
        width: 100%;
        max-width: 720px;
        padding: 14px 10px 18px;
        margin-top: auto;
        margin-bottom: auto;
      }

      .home-hdr {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
        width: 100%;
      }
      .logo {
        font-family: "Orbitron", sans-serif;
        font-size: clamp(1.4rem, 3.4vw, 2.8rem);
        font-weight: 900;
        color: var(--c);
        text-shadow: var(--glowb);
        letter-spacing: 0.15em;
        animation: pulse 3s ease-in-out infinite;
        text-align: center;
        white-space: nowrap;
      }
      @keyframes pulse {
        0%,
        100% {
          text-shadow:
            0 0 18px rgba(0, 255, 255, 0.8),
            0 0 40px rgba(0, 255, 255, 0.25);
        }
        50% {
          text-shadow:
            0 0 30px #0ff,
            0 0 60px rgba(0, 255, 255, 0.42),
            0 0 80px rgba(0, 255, 255, 0.1);
        }
      }
      .logo-sub {
        font-family: "JetBrains Mono", monospace;
        color: var(--cd);
        font-size: clamp(0.44rem, 0.7vw, 0.68rem);
        letter-spacing: 0.14em;
        opacity: 0.55;
        text-align: center;
      }
      .vtag {
        border: 1px solid var(--cm);
        padding: 1px 10px;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.57rem;
        color: var(--cm);
        letter-spacing: 0.16em;
      }

      /* ── SEARCH ── */
      .search-wrap {
        width: 100%;
        max-width: 520px;
        position: relative;
        flex-shrink: 0;
      }
      .search-wrap::before {
        content: "⌕";
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--cd);
        font-size: 1rem;
        pointer-events: none;
        z-index: 1;
      }
      #srch {
        width: 100%;
        background: rgba(0, 20, 35, 0.94);
        border: 1px solid var(--bd);
        color: var(--c);
        font-family: "JetBrains Mono", monospace;
        font-size: 0.84rem;
        padding: 9px 12px 9px 32px;
        outline: none;
        letter-spacing: 0.08em;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        backdrop-filter: blur(12px);
      }
      #srch:focus {
        border-color: var(--c);
        box-shadow:
          var(--glow),
          inset 0 0 14px rgba(0, 255, 255, 0.03);
      }
      #srch::placeholder {
        color: var(--txd);
        letter-spacing: 0.12em;
      }

      /* search results */
      #srch-results {
        width: 100%;
        max-width: 720px;
        display: none;
        flex-direction: column;
        gap: 3px;
      }
      #srch-results.show {
        display: flex;
      }
      .srch-lbl {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.6rem;
        color: var(--txd);
        letter-spacing: 0.15em;
        padding-left: 3px;
        margin-bottom: 1px;
      }
      .srch-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 11px;
        background: rgba(0, 24, 35, 0.92);
        border: 1px solid var(--bd);
        cursor: pointer;
        transition: all 0.12s;
        min-width: 0;
      }
      .srch-row:hover,
      .srch-row.focused {
        border-color: var(--c);
        box-shadow: var(--glow);
        padding-left: 18px;
      }
      .srch-cat {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.58rem;
        color: var(--cd);
        border: 1px solid var(--cm);
        padding: 1px 6px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .srch-id {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.8rem;
        color: #93a1a1;
        white-space: nowrap;
      }
      .srch-desc {
        font-size: 0.66rem;
        color: var(--txd);
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .srch-st {
        font-size: 0.62rem;
        letter-spacing: -1px;
        flex-shrink: 0;
      }
      .srch-more {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.63rem;
        color: var(--cd);
        text-align: center;
        padding: 5px;
        cursor: pointer;
        border: 1px dashed var(--cm);
        letter-spacing: 0.13em;
        transition: all 0.13s;
      }
      .srch-more:hover {
        border-color: var(--c);
        color: var(--c);
      }

      /* cat grid */
      .cat-grid-wrap {
        width: 100%;
        flex-shrink: 0;
      }
      .cat-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
      }
      .cat-card {
        background: rgba(0, 24, 35, 0.9);
        border: 1px solid var(--bd);
        padding: 18px 12px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        transition: all 0.18s;
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(12px);
      }
      .cat-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--c);
        box-shadow: 0 0 10px var(--c);
        transform: scaleX(0);
        transition: transform 0.28s;
      }
      .cat-card::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--cm), transparent);
      }
      .cat-card:hover::before,
      .cat-card.focused::before {
        transform: scaleX(1);
      }
      .cat-card:hover,
      .cat-card.focused {
        border-color: var(--c);
        box-shadow:
          var(--glow),
          inset 0 0 22px rgba(0, 255, 255, 0.04);
        transform: translateY(-2px);
      }
      .cat-icon {
        width: 38px;
        height: 38px;
        color: var(--c);
        filter: drop-shadow(0 0 7px rgba(0, 255, 255, 0.5));
      }
      .cat-name {
        font-family: "Orbitron", sans-serif;
        font-size: 0.76rem;
        font-weight: 700;
        color: var(--c);
        letter-spacing: 0.2em;
      }
      .cat-meta {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.6rem;
        color: var(--txd);
      }

      /* ── PAGINATION ── */
      .cat-pager {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        width: 100%;
        flex-shrink: 0;
        padding: 4px 0;
      }
      .pag-arrow {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.9rem;
        color: var(--cd);
        cursor: pointer;
        padding: 3px 10px;
        border: 1px solid var(--cm);
        transition: all 0.16s;
        user-select: none;
        letter-spacing: 0.05em;
        line-height: 1;
      }
      .pag-arrow:hover {
        color: var(--c);
        border-color: var(--c);
        box-shadow: var(--glow);
      }
      .pag-arrow.disabled {
        opacity: 0.2;
        pointer-events: none;
      }
      .pag-dots {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .pag-dot {
        width: 6px;
        height: 6px;
        background: var(--cm);
        cursor: pointer;
        transition: all 0.18s;
        clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      }
      .pag-dot.active {
        background: var(--c);
        box-shadow: var(--glow);
        transform: scale(1.35);
      }
      .pag-dot:hover {
        background: var(--cd);
      }

      /* ── CATEGORY (bottom-sheet style) ── */
      #view-category {
        background: transparent;
        position: relative;
        cursor: pointer;
      }
      .cat-backdrop {
        flex: 1;
        min-height: 0;
      }
      .cat-sheet {
        background: rgba(0, 20, 32, 0.97);
        border-top: 1px solid var(--bd);
        backdrop-filter: blur(24px);
        display: flex;
        flex-direction: column;
        max-height: 62vh;
        flex-shrink: 0;
        cursor: default;
        animation: slideUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes slideUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }
      .sheet-handle {
        width: 36px;
        height: 3px;
        background: var(--cm);
        margin: 7px auto 4px;
        flex-shrink: 0;
        border-radius: 2px;
        opacity: 0.6;
      }
      .panel-hdr {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 6px 14px 8px;
        border-bottom: 1px solid var(--bd);
        flex-shrink: 0;
      }
      .bk {
        font-family: "JetBrains Mono", monospace;
        color: var(--cd);
        cursor: pointer;
        padding: 4px 10px;
        border: 1px solid var(--bd);
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        transition: all 0.18s;
        user-select: none;
        flex-shrink: 0;
      }
      .bk:hover {
        color: var(--c);
        border-color: var(--c);
        box-shadow: var(--glow);
      }
      .panel-title {
        font-family: "Orbitron", sans-serif;
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--c);
        text-shadow: var(--glow);
        letter-spacing: 0.13em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* ── Virtual scroll task list ── */
      /* Subcategory cards inside a category */
      .subcat-area {
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px 10px 4px;
        border-bottom: 1px solid var(--bd);
        flex-shrink: 0;
      }
      .subcat-card {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        background: rgba(0, 14, 24, 0.82);
        border: 1px solid var(--bd);
        cursor: pointer;
        transition: all 0.15s;
        min-width: 140px;
        flex: 1;
      }
      .subcat-card:hover {
        border-color: var(--c);
        box-shadow: var(--glow);
        background: rgba(0, 28, 40, 0.82);
      }
      .subcat-icon {
        width: 28px;
        height: 28px;
        color: var(--c);
        flex-shrink: 0;
        filter: drop-shadow(0 0 5px rgba(0, 255, 255, 0.4));
      }
      .subcat-name {
        font-family: "Orbitron", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--c);
        letter-spacing: 0.14em;
      }
      .subcat-meta {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.6rem;
        color: var(--txd);
        margin-top: 1px;
      }
      /* Breadcrumb inside category header */
      .cat-breadc {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.6rem;
        color: var(--txd);
        letter-spacing: 0.08em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cat-breadc .act {
        color: var(--c);
      }

      .cat-search-wrap {
        padding: 5px 10px 4px;
        flex-shrink: 0;
        position: relative;
      }
      .cat-search-wrap::before {
        content: "⌕";
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--cd);
        font-size: 0.95rem;
        pointer-events: none;
      }
      #cat-srch {
        width: 100%;
        background: rgba(0, 14, 24, 0.9);
        border: 1px solid var(--bd);
        color: var(--c);
        font-family: "JetBrains Mono", monospace;
        font-size: 0.78rem;
        padding: 6px 10px 6px 28px;
        outline: none;
        letter-spacing: 0.06em;
        transition:
          border-color 0.18s,
          box-shadow 0.18s;
      }
      #cat-srch:focus {
        border-color: var(--c);
        box-shadow: var(--glow);
      }
      #cat-srch::placeholder {
        color: var(--txd);
        letter-spacing: 0.1em;
      }
      .task-list {
        flex: 1;
        overflow-y: auto;
        padding: 0 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .task-list::-webkit-scrollbar {
        width: 3px;
      }
      /* virtual scroll removed */
      .task-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        background: rgba(0, 20, 32, 0.75);
        border: 1px solid var(--bd);
        cursor: pointer;
        transition:
          border-color 0.14s,
          box-shadow 0.14s,
          background 0.14s,
          padding-left 0.14s;
        position: relative;
        animation: none;
      }
      .task-row::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--c);
        transform: scaleY(0);
        transition: transform 0.14s;
      }
      .task-row:hover::before,
      .task-row.focused::before {
        transform: scaleY(1);
      }
      .task-row:hover,
      .task-row.focused {
        border-color: var(--c);
        box-shadow: var(--glow);
        background: rgba(0, 38, 55, 0.75);
        padding-left: 20px;
      }
      .trow-l {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .t-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--txd);
        flex-shrink: 0;
      }
      .t-dot.ok {
        background: #859900;
        box-shadow: 0 0 5px #859900;
      }
      .t-dot.ng {
        background: #dc322f;
        box-shadow: 0 0 5px #dc322f;
      }
      .t-num {
        font-family: "JetBrains Mono", monospace;
        color: var(--txd);
        font-size: 0.67rem;
        min-width: 20px;
      }
      .t-id {
        font-family: "JetBrains Mono", monospace;
        color: #93a1a1;
        font-size: 0.83rem;
      }
      .t-desc {
        font-size: 0.67rem;
        color: var(--txd);
        margin-top: 2px;
      }
      .stars-wrap {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
      }
      .stars {
        font-size: 0.67rem;
        letter-spacing: -1px;
      }
      .d12 {
        color: #859900;
        text-shadow: 0 0 5px #859900;
      }
      .d34 {
        color: #2aa198;
        text-shadow: 0 0 5px #2aa198;
      }
      .d56 {
        color: #b58900;
        text-shadow: 0 0 5px #b58900;
      }
      .d78 {
        color: #cb4b16;
        text-shadow: 0 0 5px #cb4b16;
      }
      .d910 {
        color: #dc322f;
        text-shadow: 0 0 5px #dc322f;
      }
      .d-lbl {
        font-family: "JetBrains Mono", monospace;
        color: var(--txd);
        font-size: 0.62rem;
      }

      /* ── TASK ── */
      #view-task {
        background: #002b36;
      }
      .task-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        background: rgba(0, 20, 30, 0.98);
        border-bottom: 1px solid var(--bd);
        flex-shrink: 0;
        backdrop-filter: blur(20px);
      }
      .breadc {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.7rem;
        color: var(--txd);
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: 0.03em;
        min-width: 0;
      }
      .breadc .act {
        color: var(--c);
      }
      .tab-grp {
        display: flex;
        gap: 2px;
        flex-shrink: 0;
      }
      .tab {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.68rem;
        padding: 3px 9px;
        border: 1px solid var(--bd);
        background: transparent;
        color: var(--txd);
        cursor: pointer;
        letter-spacing: 0.08em;
        transition: all 0.13s;
        white-space: nowrap;
      }
      .tab.on {
        background: rgba(0, 255, 255, 0.1);
        border-color: var(--c);
        color: var(--c);
        box-shadow: var(--glow);
      }
      .tab.sol-tab {
        border-color: rgba(181, 137, 0, 0.28);
        color: rgba(181, 137, 0, 0.55);
      }
      .tab.sol-tab:hover,
      .tab.sol-tab.on {
        background: rgba(181, 137, 0, 0.08);
        border-color: #b58900;
        color: #b58900;
        box-shadow: 0 0 7px rgba(181, 137, 0, 0.3);
      }
      .mem-grp {
        display: flex;
        align-items: center;
        gap: 3px;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.68rem;
        color: var(--txd);
        flex-shrink: 0;
      }
      .mem-grp input {
        width: 52px;
        background: #002b36;
        border: 1px solid var(--bd);
        color: var(--c);
        font-family: "JetBrains Mono", monospace;
        font-size: 0.68rem;
        padding: 3px 5px;
        text-align: center;
        outline: none;
        -moz-appearance: textfield;
      }

      /* solutions overlay */

      .sol-code {

        border: 1px solid rgba(181, 137, 0, 0.15);

        font-size: 0.79rem;

      .sol-note {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.62rem;
        color: rgba(181, 137, 0, 0.3);
        margin-top: 11px;
        text-align: center;
        letter-spacing: 0.09em;

      /* results */
      .res-panel {
        flex: 2;
        display: flex;
        flex-direction: column;

      }
      .res-hdr {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.67rem;
        padding: 5px 11px;
        border-bottom: 1px solid var(--bd);
        color: var(--txd);
        letter-spacing: 0.12em;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
      }
      .res-sum {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .bp {
        color: #859900;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.68rem;
      }
      .bf {
        color: #dc322f;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.68rem;
      }
      .bt {
        color: var(--txd);
        font-family: "JetBrains Mono", monospace;
        font-size: 0.64rem;
      }
      #res-body {
        flex: 1;
        overflow-y: auto;
        padding: 9px 11px;
      }
      .r-suite {
        margin-bottom: 11px;
      }
      .r-suite-nm {

      .r-item {

      .r-item.pass {
        background: rgba(133, 153, 0, 0.06);

      }
      .r-item.fail {
        background: rgba(220, 50, 47, 0.06);
        border-left: 2px solid #dc322f;
      }
      .r-item.error {
        background: rgba(181, 137, 0, 0.06);
        border-left: 2px solid #b58900;
      }
      .r-nr {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .r-ico {
        font-size: 0.8rem;
      }
      .pass .r-ico {
        color: #859900;
      }
      .fail .r-ico {
        color: #dc322f;
      }
      .error .r-ico {
        color: #b58900;
      }
      .r-nm {
        color: #93a1a1;
        flex: 1;
      }
      .r-ms {
        color: var(--txd);
        font-size: 0.64rem;
      }
      .r-mem {
        color: var(--txd);
        font-size: 0.61rem;
      }
      /* ── Expandable assertions ── */
      .r-item {
        cursor: pointer;
        user-select: none;
      }
      .r-expand {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.6rem;

        margin-left: auto;
        padding-left: 8px;

        flex-shrink: 0;

      .r-item.error .r-expand {
        color: #dc322f;

        display: block;

      .r-assert {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.68rem;

        flex-wrap: wrap;
      }
      .r-assert.pass .r-a-ico {
        color: #859900;
      }
      .r-assert.fail .r-a-ico {
        color: #dc322f;
      }
      .r-a-ico {
        font-size: 0.72rem;
        flex-shrink: 0;
        width: 12px;
      }
      .r-a-matcher {
        color: #268bd2;
        flex-shrink: 0;
      }
      .r-a-exp {
        color: #859900;
      }
      .r-a-got {
        color: #dc322f;
      }
      .r-a-sep {
        color: var(--txd);
        flex-shrink: 0;
      }
      .r-err {
        color: #cb4b16;
        font-size: 0.69rem;
        padding: 2px 0 2px 17px;
        background: rgba(203, 75, 22, 0.04);
        word-break: break-all;
        white-space: pre-wrap;
      }
      .res-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--txd);
        font-family: "JetBrains Mono", monospace;
        font-size: 0.74rem;
        text-align: center;
        gap: 8px;
      }
      .res-empty .ico {
        font-size: 1.7rem;
        opacity: 0.18;
      }
      .statusbar {
        padding: 2px 11px;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.65rem;
        color: var(--txd);
        border-top: 1px solid var(--bd);
        background: #001520;
        min-height: 19px;
        display: flex;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
      }
      .statusbar.ok {
        color: #859900;
      }
      .statusbar.err {
        color: #dc322f;
      }

      /* ── MOBILE RESULTS SHEET (slide up after RUN) ── */
      .res-close {
        display: none;
      }

      @media (max-width: 680px) {
        /* Task bar: wrap into two rows */
        .task-bar {
          flex-wrap: wrap;
          gap: 4px;
          padding: 4px 6px;
        }
        .breadc {
          order: -1;
          width: 100%;
          font-size: 0.64rem;
        }
        .mem-grp {
          display: none;
        } /* hide on tiny screens */
        .tab {
          font-size: 0.64rem;
          padding: 3px 7px;
        }
        .run-btn {
          font-size: 0.66rem;
          padding: 5px 10px;
          letter-spacing: 0.12em;
        }

        /* Editor fills the whole area */
        .editor-area {
          flex-direction: column;
        }
        .ed-panel {
          flex: 1;
          border-right: none;
          min-height: 0;
        }

        /* Results panel becomes a fixed bottom sheet */
        .res-panel {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          height: 60vh;
          z-index: 200;
          border-top: 1px solid var(--c);
          box-shadow: 0 -4px 40px rgba(0, 200, 255, 0.12);
          transform: translateY(110%);
          transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .res-panel.mob-open {
          transform: translateY(0);
        }

        /* Close handle for the sheet */
        .res-close {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 22px;
          cursor: pointer;
          flex-shrink: 0;
          background: rgba(0, 255, 255, 0.04);
          border-bottom: 1px solid var(--bd);
        }
        .res-close::before {
          content: "";
          display: block;
          width: 32px;
          height: 3px;
          background: var(--cm);
          border-radius: 2px;
        }
        .res-close:hover::before {
          background: var(--c);
        }

        /* Cat grid: 2 columns on mobile */
        .cat-grid {
          grid-template-columns: repeat(2, 1fr);
        }

        /* Home: tighter */
        .home-content {
          gap: 8px;
          padding: 10px 8px 14px;
        }
        .logo {
          font-size: clamp(1.2rem, 6vw, 2rem);
        }
        .logo-sub {
          font-size: 0.55rem;
          letter-spacing: 0.08em;
        }
      }

      @media (max-width: 400px) {
        .cat-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .tab-grp {
          gap: 1px;
        }
        .tab {
          font-size: 0.6rem;
          padding: 2px 6px;
        }
      }
      /* ── STRICT MODE TOGGLE ── */
      .strict-grp {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.63rem;
        color: var(--txd);
        cursor: pointer;
        user-select: none;
        padding: 3px 7px;
        border: 1px solid var(--bd);
        transition: all 0.14s;
        white-space: nowrap;
      }
      .strict-grp:hover {
        border-color: var(--c);
        color: var(--c);
      }
      .strict-grp.strict-on {
        border-color: #b58900;
        color: #b58900;
        background: rgba(181, 137, 0, 0.07);
      }
      .strict-grp.strict-locked {
        opacity: 0.75;
        cursor: not-allowed;
      }
      .strict-chk {
        width: 11px;
        height: 11px;
        border: 1px solid currentColor;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.55rem;
      }

      /* ── FONT SIZE CONTROL ── */
      .fz-grp {
        display: flex;
        align-items: center;
        gap: 2px;
        flex-shrink: 0;
      }
      .fz-btn {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.8rem;
        width: 20px;
        height: 20px;
        border: 1px solid var(--bd);
        background: transparent;
        color: var(--txd);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.12s;
        line-height: 1;
        padding: 0;
      }
      .fz-btn:hover {
        border-color: var(--c);
        color: var(--c);
      }
      .fz-val {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.62rem;
        color: var(--txd);
        min-width: 22px;
        text-align: center;
        pointer-events: none;
      }

      #hud {
        position: fixed;
        bottom: 10px;
        left: 10px;
        z-index: 50;
        display: flex;
        gap: 6px;
      }
      .hud-btn {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.62rem;
        padding: 4px 10px;
        background: rgba(0, 20, 30, 0.9);
        border: 1px solid var(--cm);
        color: var(--txd);
        cursor: pointer;
        letter-spacing: 0.09em;
        transition: all 0.15s;
        backdrop-filter: blur(8px);
        user-select: none;
      }
      .hud-btn:hover {
        border-color: var(--c);
        color: var(--c);
        box-shadow: var(--glow);
      }
      .hud-btn.active {
        border-color: rgba(220, 50, 47, 0.45);
        color: rgba(220, 80, 80, 0.7);
      }
      .hud-btn.active:hover {
        border-color: #dc322f;
        color: #dc322f;
      }

      /* ── MODAL ── */
      .modal-bg {
        position: fixed;
        inset: 0;
        z-index: 800;
        background: rgba(0, 15, 22, 0.88);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: mfade 0.13s ease;
      }
      @keyframes mfade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .modal-bg.hide {
        display: none;
      }
      .modal {
        background: #002b36;
        border: 1px solid rgba(181, 137, 0, 0.35);
        max-width: 360px;
        width: 90%;
        padding: 24px;
        position: relative;
        box-shadow:
          0 0 30px rgba(181, 137, 0, 0.08),
          0 0 60px rgba(0, 0, 0, 0.5);
      }
      .modal::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #b58900, transparent);
      }
      .m-ico {
        font-size: 1.4rem;
        text-align: center;
        margin-bottom: 7px;
      }
      .m-title {
        font-family: "Orbitron", sans-serif;
        font-size: 0.83rem;
        font-weight: 700;
        color: #b58900;
        letter-spacing: 0.14em;
        text-align: center;
        margin-bottom: 8px;
      }
      .m-body {
        font-family: "JetBrains Mono", monospace;

        text-align: center;
        margin-bottom: 18px;
        opacity: 0.8;
      }
      .m-acts {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      .m-btn {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.72rem;
        padding: 6px 17px;
        border: 1px solid;
        cursor: pointer;
        letter-spacing: 0.12em;
        transition: all 0.13s;
      }
      .m-btn.cancel {
        border-color: var(--bd);
        color: var(--txd);
        background: transparent;
      }
      .m-btn.cancel:hover {
        border-color: var(--c);
        color: var(--c);
        box-shadow: var(--glow);
      }
      .m-btn.go {
        border-color: #b58900;
        color: #b58900;
        background: rgba(181, 137, 0, 0.05);
      }
      .m-btn.go:hover {
        background: rgba(181, 137, 0, 0.12);
        box-shadow: 0 0 8px rgba(181, 137, 0, 0.28);
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div id="boot-logo">GRID::RUNNER</div>
      <div id="boot-lines"></div>
    </div>
    <canvas id="bg"></canvas>

    <div id="app">
      <!-- HOME -->
      <div id="view-home" class="view active">
        <div class="home-content">
          <div class="home-hdr">
            <div class="logo">GRID::RUNNER</div>
            <div class="logo-sub">
              // JAVASCRIPT ALGORITHM TESTING ENVIRONMENT //
            </div>
            <div class="vtag">v1.3.0 — CYBERNETIC BUILD</div>
          </div>
          <div class="search-wrap">
            <input
              id="srch"
              type="text"
              placeholder="SEARCH_PROTOCOL... [F]"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div id="srch-results"></div>
          <div class="cat-grid-wrap">
            <div class="cat-grid" id="cat-grid"></div>
          </div>
          <div class="cat-pager" id="cat-pager" style="display: none">
            <div class="pag-arrow" id="pag-prev" onclick="prevCatPage()">◁</div>
            <div class="pag-dots" id="pag-dots"></div>
            <div class="pag-arrow" id="pag-next" onclick="nextCatPage()">▷</div>
          </div>
        </div>
      </div>

      <!-- CATEGORY (bottom sheet) -->
      <div
        id="view-category"
        class="view"
        id="view-category"
        onclick="handleCatBgClick(event)"
      >
        <div class="cat-backdrop"></div>
        <div class="cat-sheet" id="cat-sheet">
          <div class="sheet-handle"></div>
          <div class="panel-hdr">
            <div class="bk" id="bk-cat">← BACK</div>
            <div
              style="
                display: flex;
                flex-direction: column;
                gap: 2px;
                min-width: 0;
                flex: 1;
              "
            >
              <div class="panel-title" id="cat-lbl">CATEGORY</div>
              <div class="cat-breadc" id="cat-breadc"></div>
            </div>
            <div
              style="
                font-family: &quot;JetBrains Mono&quot;, monospace;
                font-size: 0.65rem;
                color: var(--txd);
                flex-shrink: 0;
              "
              id="cat-cnt"
            ></div>
          </div>
          <div class="cat-search-wrap">
            <input
              id="cat-srch"
              type="text"
              placeholder="SEARCH TASKS..."
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div class="subcat-area" id="subcat-area" style="display: none"></div>
          <div class="task-list" id="task-list"></div>
        </div>
      </div>

      <!-- TASK -->
      <div id="view-task" class="view">
        <div class="task-bar">
          <div class="bk" id="bk-task">← BACK</div>

            </button>
            <button class="tab" id="tab-sp" onclick="switchTab('sp')">
              SPEC
            </button>
            <button
              class="tab sol-tab"

              onclick="requestSolutions()"
            >
              SOLUTIONS
            </button>

          <div

            id="fz-grp"

            <span class="fz-val" id="fz-val">14</span>
            <button class="fz-btn" onclick="changeFZ(+1)">+</button>
          </div>
          <!-- strict mode -->
          <div
            class="strict-grp strict-on"
            id="strict-grp"
            onclick="toggleStrict()"
            title="STRICT MODE: compare speed vs reference solution"
          >
            <div class="strict-chk" id="strict-chk">✓</div>
            <span>STRICT</span>
          </div>
          <div class="mem-grp">

            <input

        <div class="editor-area">

                    margin-top: 18px;
                    font-size: 0.85rem;
                    padding: 10px 36px;
                    letter-spacing: 0.25em;
                    box-shadow: 0 0 18px rgba(0, 255, 255, 0.2);
                  "

          </div>
        </div>

      <div class="hud-btn" id="btn-mute" onclick="toggleMute()">♪ SOUND</div>
    </div>

    <div class="modal-bg hide" id="modal">
      <div class="modal">
        <div class="m-ico">📋</div>
        <div class="m-title">SHOW SOLUTION?</div>
        <div class="m-body">
          Reference solution for this task will be displayed.
        </div>

    <!-- WORKER — runs in a separate thread; all tests are WebWorker-isolated -->
    <script id="wk" type="x/worker">
      // ── Jest-compatible mini test runner ──────────────────────────────
      function makeRunner(){
        const suites={};let curSuite='__root__';
        let _asserts=null; // soft assertion collector, active during it()

        function describe(n,fn){
          curSuite=n;if(!suites[n])suites[n]=[];
          try{fn();}catch(e){suites[n].push({name:'(setup)',status:'error',error:e.message,time:0,mem:null,assertions:[]});}
        }

        function it(name,fn){
          const s=curSuite;if(!suites[s])suites[s]=[];
          const assertions=[];
          _asserts=assertions;
          const mb=self.performance?.memory?.usedJSHeapSize??-1,t0=self.performance.now();
          let runtimeErr=null;
          try{fn();}
          catch(e){runtimeErr=e.message;}
          const dt=self.performance.now()-t0,ma=self.performance?.memory?.usedJSHeapSize??-1;
          _asserts=null;
          const failed=assertions.filter(a=>a.status==='fail');
          const status=runtimeErr?'error':failed.length?'fail':'pass';
          suites[s].push({
            name,status,time:dt,mem:ma>=0?ma-mb:null,assertions,
            error:runtimeErr||(failed.length?failed.length+' assertion(s) failed':null)
          });
        }
        const test=it;

        function expect(v){
          function soft(ok,matcher,expected,received){
            const entry={status:ok?'pass':'fail',matcher,
              expected:expected!==undefined?trunc(JSON.stringify(expected)):undefined,
              received:received!==undefined?trunc(JSON.stringify(received)):trunc(JSON.stringify(v))};
            if(_asserts){_asserts.push(entry);}
            else if(!ok){throw new Error(matcher+': expected '+JSON.stringify(expected)+' got '+JSON.stringify(v));}
          }
          function trunc(s){return s&&s.length>120?s.slice(0,117)+'...':s;}
          const m={
            toBe:(e)=>soft(Object.is(v,e),'toBe',e,v),
            toEqual:(e)=>soft(JSON.stringify(v)===JSON.stringify(e),'toEqual',e,v),
            toStrictEqual:(e)=>soft(JSON.stringify(v)===JSON.stringify(e),'toStrictEqual',e,v),
            toMatch:(r)=>{const re=typeof r==='string'?new RegExp(r):r;soft(re.test(String(v)),'toMatch',String(r),v);},
            toBeTruthy:()=>soft(!!v,'toBeTruthy',true,v),
            toBeFalsy:()=>soft(!v,'toBeFalsy',false,v),
            toBeNull:()=>soft(v===null,'toBeNull',null,v),
            toBeUndefined:()=>soft(v===undefined,'toBeUndefined',undefined,v),
            toBeDefined:()=>soft(v!==undefined,'toBeDefined','defined',v),
            toContain:(i)=>soft(Array.isArray(v)?v.includes(i):String(v).includes(String(i)),'toContain',i,v),
            toHaveLength:(n)=>soft(v!=null&&v.length===n,'toHaveLength',n,v?.length),
            toBeGreaterThan:(n)=>soft(v>n,'toBeGreaterThan',n,v),
            toBeLessThan:(n)=>soft(v<n,'toBeLessThan',n,v),
            toBeGreaterThanOrEqual:(n)=>soft(v>=n,'toBeGreaterThanOrEqual',n,v),
            toBeLessThanOrEqual:(n)=>soft(v<=n,'toBeLessThanOrEqual',n,v),
            toThrow:()=>{let threw=false;try{v();}catch(e){threw=true;}soft(threw,'toThrow','throws','did not throw');},
          };
          m.not={};
          Object.keys(m).forEach(k=>{
            if(k==='not')return;
            m.not[k]=(...args)=>{
              if(!_asserts){// outside it() — old behaviour
                let ok=false;try{m[k](...args);}catch(e){ok=true;}
                if(!ok)throw new Error('NOT expected: '+k);
                return;
              }
              const before=_asserts.length;
              m[k](...args);
              if(_asserts.length>before){
                const last=_asserts[_asserts.length-1];
                last.status=last.status==='pass'?'fail':'pass';
                last.matcher='not.'+last.matcher;
              }
            };
          });
          return m;
        }
        return{suites,describe,it,test,expect};
      }

      // ── compileSol: execute solution JS, return module.exports ─────
      // Fully Node.js-compatible: module.exports, exports, require all work.
      // require('./anything') returns the compiled exports so specs can do:
      //   const f = require('./ex1.js')         → module.exports directly
      //   const [r1,r2,r3] = require('./ex27.js') → destructured
      //   const { fn } = require('./util.js')   → property access
      function compileSol(sol) {
        const mod = { exports: {} };
        const requireFn = () => mod.exports;
        new Function('module', 'exports', 'require', sol)(mod, mod.exports, requireFn);
        return mod.exports;
      }

      // ── Single run ────────────────────────────────────────────────────
      // No cleanSpec stripping, no injected `f` param — clean Node.js semantics.
      // Each call has its own fresh context: no scope bleed between ref and user runs.
      function singleRun(sol, spec) {
        const {suites, describe, it, test, expect} = makeRunner();
        const t0 = self.performance.now();
        let ex;
        try { ex = compileSol(sol); }
        catch(err) { return {error: 'SYNTAX/RUNTIME:\n' + err.message, suites: {}, total: 0}; }
        const requireFn = () => ex;
        try {
          new Function('describe', 'it', 'test', 'expect', 'require', spec)(
            describe, it, test, expect, requireFn
          );
        } catch(err) {
          if (!suites['__root__']) suites['__root__'] = [];
          suites['__root__'].push({name: 'spec error', status: 'error', error: err.message, time: 0, mem: null});
        }
        return {suites, total: self.performance.now() - t0};
      }

      // ── Benchmark: run up to maxRuns times, stop at timeLimit ms ──────
      // Returns {minTime, runs, suites (last run)}
      function benchmark(sol,spec,maxRuns,timeLimit){
        const wallStart=self.performance.now();
        let minTime=Infinity,runs=0,lastResult=null;
        while(runs<maxRuns&&(self.performance.now()-wallStart)<timeLimit){
          const r=singleRun(sol,spec);
          if(r.error) return{error:r.error};
          const all=Object.values(r.suites).flat();
          const totalTime=all.reduce((a,t)=>a+t.time,0);
          if(totalTime<minTime) minTime=totalTime;
          lastResult=r;
          runs++;
        }
        return{minTime,runs,suites:lastResult?.suites||{},total:lastResult?.total||0};
      }

      self.onmessage=function(e){
        const{sol,spec,mode,refSol,maxRuns,timeLimit}=e.data;

        if(mode==='benchmark'){
          // benchmark both ref and user, return minTimes
          const refB=benchmark(refSol,spec,maxRuns,timeLimit);
          if(refB.error){self.postMessage({error:'REF ERROR: '+refB.error});return;}
          self.postMessage({type:'ref_done',refRuns:refB.runs,refMinTime:refB.minTime});

          const userB=benchmark(sol,spec,maxRuns,timeLimit);
          if(userB.error){self.postMessage({error:'USER ERROR: '+userB.error});return;}
          self.postMessage({
            type:'bench_done',
            suites:userB.suites,total:userB.total,
            userMinTime:userB.minTime,userRuns:userB.runs,
            refMinTime:refB.minTime,refRuns:refB.runs,
          });
        } else {
          // normal single run
          const r=singleRun(sol,spec);
          self.postMessage(r);
        }
      };
    </script>

      // ═══════════ BACKGROUND ═══════════
      const cv = document.getElementById("bg"),

      let T = 0,

      function resize() {

      resize();
      window.addEventListener("resize", resize);

      function lcg(seed) {
        let s = seed >>> 0;
        return () => {
          s = (1664525 * s + 1013904223) >>> 0;
          return s / 4294967296;
        };
      }
      const rnd = lcg(0xcafe1234);
      const STARS = Array.from({ length: 120 }, () => ({
        x: rnd(),
        y: rnd() * 0.44,
        sz: rnd() < 0.14 ? 1.5 : 1,
        ph: rnd() * Math.PI * 2,
        sp: 0.28 + rnd() * 0.48,
      }));

      function drawBg(t) {
        const W = cv.width,
          H = cv.height;
        const sky = cx.createLinearGradient(0, 0, 0, H * 0.56);
        sky.addColorStop(0, "#000005");
        sky.addColorStop(0.75, "#000a10");
        sky.addColorStop(1, "#001420");
        cx.fillStyle = sky;
        cx.fillRect(0, 0, W, H);
        const gnd = cx.createLinearGradient(0, H * 0.5, 0, H);
        gnd.addColorStop(0, "#000d18");
        gnd.addColorStop(1, "#000208");
        cx.fillStyle = gnd;
        cx.fillRect(0, H * 0.5, W, H * 0.5);
        const hg = cx.createLinearGradient(0, H * 0.43, 0, H * 0.62);
        hg.addColorStop(0, "rgba(0,80,140,0)");
        hg.addColorStop(0.5, "rgba(0,180,220,.1)");
        hg.addColorStop(1, "rgba(0,80,140,0)");
        cx.fillStyle = hg;
        cx.fillRect(0, H * 0.43, W, H * 0.22);
        cx.save();
        STARS.forEach((s) => {
          const fl = 0.3 + 0.7 * Math.abs(Math.sin(t * s.sp + s.ph));
          cx.fillStyle = `rgba(160,220,255,${fl * 0.5})`;
          cx.fillRect(s.x * W, s.y * H, s.sz, s.sz);
        });
        cx.restore();
        drawGrid(W, H, t);
        if (Math.random() < 0.0038) lightnings.push(mkLightning(W, H));
        cx.save();
        lightnings = lightnings.filter((l) => l.a > 0.01);
        lightnings.forEach((l) => {
          l.a -= l.dk;
          drawLP(l.pts, 1.4, l.a * 0.88);
          l.br.forEach((b) => drawLP(b, 0.65, l.a * 0.36));
          if (l.a > 0.65) {

            cx.fillRect(0, 0, W, H);
          }
        });

      }
      function drawGrid(W, H, t) {
        const hz = H * 0.5,
          vpX = W * 0.5,
          NV = 26,
          dz = 1,
          spd = 0.52,
          scroll = (t * spd) % dz,
          maxN = 32;
        // ── GRID_SPREAD controls how wide the infinite plane appears.
        // 0.0 = road-narrow,  0.8 = moderate (default),  2.0+ = extremely wide.
        // Increase to push vertical lines further beyond screen edges.
        const GRID_SPREAD = 0.8;
        const BL = -W * GRID_SPREAD;
        const BR = W * (1 + GRID_SPREAD);
        cx.save();
        cx.beginPath();
        cx.rect(0, hz, W, H - hz + 2);
        cx.clip();
        for (let i = 0; i <= NV; i++) {
          const bx = BL + (i / NV) * (BR - BL),
            isMid = i === NV / 2;
          cx.beginPath();
          cx.moveTo(vpX, hz);
          cx.lineTo(bx, H + 4);
          cx.strokeStyle = `rgba(0,200,255,${isMid ? 0.5 : 0.14})`;
          cx.lineWidth = isMid ? 1.2 : 0.55;
          cx.stroke();
        }
        const C = (H - hz) * dz;
        for (let n = 1; n <= maxN; n++) {
          const wz = n * dz - scroll;
          if (wz <= 0.01) continue;
          const y = hz + C / wz;
          if (y <= hz + 0.5 || y > H + 4) continue;
          const frac = (y - hz) / (H - hz);
          const lx = vpX + (BL - vpX) * frac,
            rx = vpX + (BR - vpX) * frac;
          const alpha = Math.min(0.42, frac * frac * 1.8);
          cx.beginPath();
          cx.moveTo(lx, y);
          cx.lineTo(rx, y);
          cx.strokeStyle = `rgba(0,200,255,${alpha})`;
          cx.lineWidth = 0.55;
          cx.stroke();

        const hgl = cx.createLinearGradient(0, hz - 2, 0, hz + 7);

        hgl.addColorStop(0.5, "rgba(0,200,255,.17)");

        cx.fillStyle = hgl;
        cx.fillRect(0, hz - 2, W, 9);

          ICONSTORE[node.folder] = svg;
        } catch (e) {
          ICONSTORE[node.folder] = FALLBACK_SVG;
        }
        // Config: tasks from window.CFG_{id}
        node.tasks = node.tasks || [];
        await new Promise((resolve) => {
          const key = `CFG_${node.id}`;
          if (window[key]) {
            processConfig(node, window[key]);
            resolve();
            return;
          }
          const s = document.createElement("script");
          s.src = `config/${node.folder}.js`;
          s.onload = () => {
            processConfig(node, window[key] || []);
            resolve();
          };
          s.onerror = () => resolve();
          document.head.appendChild(s);
        });
        // Recurse into children (from menu.js + virtual Folder nodes from config)
        if (node.children && node.children.length) {
          await Promise.all(node.children.map(bootNode));
        }
      }

      // processConfig: plain tasks → node.tasks; {type:"Folder"} → virtual children
      function processConfig(node, entries) {
        node.tasks = node.tasks || [];
        node.children = node.children || [];
        for (const entry of entries) {
          if (entry.type === "Folder") {
            const folderPath =
              entry.path ||
              node.folder +
                "/" +
                entry.name
                  .toLowerCase()
                  .replace(/\s+/g, "-")
                  .replace(/[^a-z0-9\-\/]/g, "");
            const tasks = (entry.files || []).map((t) => ({
              ...t,
              _folder: folderPath,
            }));
            const childId = "vf_" + folderPath.replace(/\//g, "_");
            // avoid duplicates if bootNode is called multiple times
            if (!node.children.find((c) => c.id === childId)) {
              node.children.push({
                id: childId,
                name: entry.name,
                desc: entry.desc || "",
                folder: folderPath,
                tasks,
                children: [],
                _virtual: true,
              });
            }
          } else {
            node.tasks.push({ ...entry, _folder: node.folder });
          }
        }
      }

      (async () => {
        await Promise.all(MENU.map(bootNode));
        renderCats("");
        // After boot: try to restore state from URL query params
        restoreRoute();
      })();

      // ═══════════ FILE LOADING ═══════════
      async function loadTask(cat, task) {
        const key = `${cat.id}/${task.id}`;
        if (FILECACHE[key]) return FILECACHE[key];
        // task._folder set by processConfig (Folder items); fall back to cat.folder
        const taskFolder = task._folder || cat.folder;
        const base = `grid/${taskFolder}/${task.file}`;
        const t = Date.now(); // cache-bust: each page load gets fresh files
        const load = (u) =>
          fetch(`${u}?t=${t}`).then((r) => {
            if (!r.ok) throw 0;
            return r.text();
          });
        try {
          const [code, spec, sol] = await Promise.all([
            load(`${base}.js`),
            load(`${base}.spec.js`),
            load(`${base}.sol.js`).catch(() => null),
          ]);
          FILECACHE[key] = { code, spec, sol };
        } catch (e) {
          FILECACHE[key] = {
            code: `// ⚠ File not found: ${task.file}.js\n// Start: python3 -m http.server 8080\n`,
            spec: `// ⚠ File not found: ${task.file}.spec.js`,
            sol: null,
          };
        }
        return FILECACHE[key];
      }

      // ═══════════ SEARCH ═══════════
      let _srchTimer = null,
        _srchPage = 1,
        _srchAll = [],
        _srchFocusIdx = -1;
      const PAGE_SRCH = 5;

      document.getElementById("srch").addEventListener("input", (e) => {
        clearTimeout(_srchTimer);
        const q = e.target.value.trim();
        if (!q) {
          hideSrch();
          renderCats("");
          document.querySelector(".cat-grid-wrap").style.display = "";
          return;
        }
        document.querySelector(".cat-grid-wrap").style.display = "none";
        _srchTimer = setTimeout(() => doSearch(q), 270);
      });
      document.getElementById("srch").addEventListener("keydown", (e) => {
        playType();
        if (e.key === "Escape") {
          e.preventDefault();
          clearSrch();
          return;
        }
        if (e.key === "Enter") {
          e.preventDefault();
          const rows = document.querySelectorAll(".srch-row");
          if (_srchFocusIdx >= 0 && rows[_srchFocusIdx]) {
            rows[_srchFocusIdx].click();
            return;
          }
          if (_srchAll.length === 1) {
            navigateToTask(_srchAll[0].cat, _srchAll[0].task);
            return;
          }
          return;
        }
        if (e.key === "ArrowDown") {
          e.preventDefault();
          const rows = document.querySelectorAll(".srch-row");
          if (!rows.length) return;
          _srchFocusIdx = Math.min(_srchFocusIdx + 1, rows.length - 1);
          rows.forEach((r, i) =>
            r.classList.toggle("focused", i === _srchFocusIdx),
          );
          return;
        }
        if (e.key === "ArrowUp") {
          e.preventDefault();
          const rows = document.querySelectorAll(".srch-row");
          if (!rows.length) return;
          _srchFocusIdx = Math.max(_srchFocusIdx - 1, 0);
          rows.forEach((r, i) =>
            r.classList.toggle("focused", i === _srchFocusIdx),
          );
          return;
        }
      });
      function clearSrch() {
        document.getElementById("srch").value = "";
        _srchFocusIdx = -1;
        hideSrch();
        renderCats("");
        document.querySelector(".cat-grid-wrap").style.display = "";
        document.getElementById("srch").blur();
      }
      function hideSrch() {
        const sr = document.getElementById("srch-results");
        sr.innerHTML = "";
        sr.classList.remove("show");
        _srchAll = [];
        _srchPage = 1;
        _srchFocusIdx = -1;
      }
      // Recursively collect all {cat, task} pairs from the full menu tree
      function gatherAllTasks(node, results) {
        (node.tasks || []).forEach((t) => results.push({ cat: node, task: t }));
        (node.children || []).forEach((child) =>
          gatherAllTasks(child, results),
        );
      }

      function doSearch(q) {
        const ql = q.toLowerCase();
        _srchAll = [];
        const all = [];
        MENU.forEach((cat) => gatherAllTasks(cat, all));
        all.forEach(({ cat, task: t }) => {
          if (
            t.id.toLowerCase().includes(ql) ||
            t.title.toLowerCase().includes(ql) ||
            t.desc.toLowerCase().includes(ql)
          )
            _srchAll.push({ cat, task: t });
        });
        _srchPage = 1;
        _srchFocusIdx = -1;
        renderSrch();
        // filter categories too
        _filteredMenu = MENU.filter((cat) => {
          return (
            cat.name.toLowerCase().includes(ql) ||
            cat.desc.toLowerCase().includes(ql) ||
            cat.tasks.some(
              (t) =>
                t.id.toLowerCase().includes(ql) ||
                t.title.toLowerCase().includes(ql) ||
                t.desc.toLowerCase().includes(ql),
            )
          );
        });
        catPage = 0;
        renderCatGrid(_filteredMenu);
      }
      function renderSrch() {
        const sr = document.getElementById("srch-results");
        sr.innerHTML = "";
        if (!_srchAll.length) {
          sr.classList.remove("show");
          return;
        }
        sr.classList.add("show");
        const lbl = document.createElement("div");
        lbl.className = "srch-lbl";
        lbl.textContent = `// ${_srchAll.length} MATCH${_srchAll.length !== 1 ? "ES" : ""} FOUND //`;
        sr.appendChild(lbl);
        const slice = _srchAll.slice(0, _srchPage * PAGE_SRCH);
        slice.forEach(({ cat, task }, i) => {
          const el = document.createElement("div");
          el.className = "srch-row";
          if (i === _srchFocusIdx) el.classList.add("focused");
          el.innerHTML = `<span class="srch-cat">${cat.name}</span>
      <span class="srch-id">${task.id.toUpperCase()}</span>
      <span class="srch-desc">— ${task.desc}</span>
      <span class="srch-st ${diffCls(task.diff)}">${mkStars(task.diff)}</span>`;
          el.onclick = () => navigateToTask(cat, task);
          sr.appendChild(el);
        });
        if (_srchAll.length > slice.length) {
          const more = document.createElement("div");
          more.className = "srch-more";
          more.textContent = `▼ SHOW MORE (${_srchAll.length - slice.length} remaining)`;
          more.onclick = () => {
            _srchPage++;
            renderSrch();
          };
          sr.appendChild(more);
        }
      }
      function navigateToTask(cat, task) {
        playNav();
        clearSrch();
        openTask(cat, task);
      }

      // ═══════════ HOME / CAT GRID + PAGINATION ═══════════
      function renderCats(q) {
        if (q) {
          return;
        } // handled by doSearch
        _filteredMenu = MENU;
        catPage = 0;
        renderCatGrid(MENU);
      }

      function renderCatGrid(list) {
        const totalPages = Math.ceil(list.length / PAGE_SIZE);
        const pageItems = list.slice(
          catPage * PAGE_SIZE,
          (catPage + 1) * PAGE_SIZE,
        );
        const g = document.getElementById("cat-grid");
        g.innerHTML = "";
        focusCatIdx = -1;
        pageItems.forEach((cat) => {
          const el = document.createElement("div");
          el.className = "cat-card";
          const icon = ICONSTORE[cat.folder] || FALLBACK_SVG;
          const taskCount = countTasks(cat);
          const subCount = (cat.children || []).length;
          const meta = taskCount
            ? taskCount +
              " TASKS" +
              (subCount ? ", " + subCount + " FOLDERS" : "")
            : subCount
              ? subCount + " FOLDERS"
              : "COMING SOON";
          el.innerHTML = `<div class="cat-icon">${icon}</div>
      <div class="cat-name">${cat.name}</div>
      <div class="cat-meta">${meta}</div>`;
          el.onclick = () => {
            playNav();
            openCat(cat);
          };
          g.appendChild(el);
        });
        // pagination
        const pager = document.getElementById("cat-pager");
        if (totalPages <= 1) {
          pager.style.display = "none";
          return;
        }
        pager.style.display = "flex";
        document
          .getElementById("pag-prev")
          .classList.toggle("disabled", catPage === 0);
        document
          .getElementById("pag-next")
          .classList.toggle("disabled", catPage >= totalPages - 1);
        const dots = document.getElementById("pag-dots");
        dots.innerHTML = "";
        for (let i = 0; i < totalPages; i++) {
          const d = document.createElement("div");
          d.className = "pag-dot" + (i === catPage ? " active" : "");
          d.onclick = (() => {
            const p = i;
            return () => {
              catPage = p;
              renderCatGrid(_filteredMenu);
              playClick();
            };
          })();
          dots.appendChild(d);
        }
      }
      function prevCatPage() {
        if (catPage > 0) {
          catPage--;
          renderCatGrid(_filteredMenu);
          playClick();
        }
      }
      function nextCatPage() {
        const tp = Math.ceil(_filteredMenu.length / PAGE_SIZE);
        if (catPage < tp - 1) {
          catPage++;
          renderCatGrid(_filteredMenu);
          playClick();
        }
      }

      // ═══════════ CATEGORY (bottom sheet) ═══════════
      function handleCatBgClick(e) {
        // clicking the backdrop (not the sheet) goes back
        if (
          e.target === e.currentTarget ||
          e.target.classList.contains("cat-backdrop")
        ) {
          playClick();
          showView("home");
        }
      }

      // Count all tasks recursively in a node
      function countTasks(node) {
        let n = (node.tasks || []).length;
        (node.children || []).forEach((c) => {
          n += countTasks(c);
        });
        return n;
      }

      function openCat(cat) {
        // Push onto nav stack (unless already the top)
        if (!navStack.length || navStack[navStack.length - 1] !== cat) {
          navStack.push(cat);
        }
        // Sync URL — category only (task param dropped)
        setQueryParams({ cat: cat.id });
        document.getElementById("cat-lbl").textContent =
          cat.name + (cat.desc ? " // " + cat.desc : "");
        const taskN = (cat.tasks || []).length;
        const subN = (cat.children || []).length;
        const meta =
          [taskN ? taskN + " TASKS" : "", subN ? subN + " FOLDERS" : ""]
            .filter(Boolean)
            .join(", ") || "EMPTY";
        document.getElementById("cat-cnt").textContent = meta;
        // Reset cat search
        const catSrch = document.getElementById("cat-srch");
        if (catSrch) catSrch.value = "";
        _vsQuery = "";
        _vsMatches = [];
        clearTimeout(_catsrchTimer);
        // Update breadcrumb
        updateCatBreadcrumb();
        renderCatContent(cat);
        showView("category");
      }

      function updateCatBreadcrumb() {
        // Show path: HOME / ALGO / SORTING
        const parts = navStack.map((n, i) => {
          const isLast = i === navStack.length - 1;
          return isLast
            ? `<span class="act">${n.name}</span>`
            : `<span style="cursor:pointer;color:var(--cd)" onclick="navTo(${i})">${n.name}</span>`;
        });
        const el = document.getElementById("cat-breadc");
        if (el)
          el.innerHTML = parts.join(
            ' <span style="color:var(--txd)">/</span> ',
          );
      }

      // Navigate to a specific depth in the stack (click on breadcrumb ancestor)
      function navTo(idx) {
        navStack = navStack.slice(0, idx + 1);
        openCat(navStack[navStack.length - 1]);
      }

      // Render the current category node:
      // - subcategory cards (if any children)
      // - task list via virtual scroll (if any tasks)
      function renderCatContent(cat) {
        const subcats = cat.children || [];
        const tasks = cat.tasks || [];

        // Subcat cards
        const subArea = document.getElementById("subcat-area");
        if (subArea) {
          if (subcats.length) {
            subArea.style.display = "";
            subArea.innerHTML = "";
            subcats.forEach((sub) => {
              const el = document.createElement("div");
              el.className = "subcat-card";
              const icon = ICONSTORE[sub.folder] || FALLBACK_SVG;
              const n = countTasks(sub);
              el.innerHTML = `<div class="subcat-icon">${icon}</div>
                <div><div class="subcat-name">${sub.name}</div>
                <div class="subcat-meta">${n ? n + " TASKS" : "EMPTY"}</div></div>`;
              el.onclick = () => {
                playNav();
                openCat(sub);
              };
              subArea.appendChild(el);
            });
          } else {
            subArea.style.display = "none";
          }
        }

        // Tasks
        renderTaskList(cat);
      }

      // ── Task list state ──
      let _vsCat = null;
      let _vsQuery = ""; // current search query
      let _vsMatches = []; // indices of matching tasks
      let _catsrchTimer = null;

      // Wire up cat search — debounce 30ms, scroll+dim, no filter
      document.getElementById("cat-srch").addEventListener("input", (e) => {
        playType();
        clearTimeout(_catsrchTimer);
        const raw = e.target.value.trim();
        _catsrchTimer = setTimeout(() => applyTaskSearch(raw), 300);
      });
      document.getElementById("cat-srch").addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          e.target.value = "";
          clearTimeout(_catsrchTimer);
          applyTaskSearch("");
        }
      });

      function applyTaskSearch(q) {
        _vsQuery = q.toLowerCase();
        if (!_vsCat) return;
        const tasks = _vsCat.tasks;
        _vsMatches = q
          ? tasks.reduce((acc, t, i) => {
              if (
                t.id.toLowerCase().includes(_vsQuery) ||
                t.title.toLowerCase().includes(_vsQuery) ||
                t.desc.toLowerCase().includes(_vsQuery)
              )
                acc.push(i);
              return acc;
            }, [])
          : [];
        // Re-render all visible rows (updates dimming)
        renderRows();
        // Scroll to first match
        if (_vsMatches.length) {
          const el = document.getElementById("task-list");
          // Scroll to first matching row by finding it in DOM
          if (el) {
            const rows = el.querySelectorAll(".task-row");
            const firstMatchRow = rows[_vsMatches[0]];
            if (firstMatchRow)
              firstMatchRow.scrollIntoView({
                block: "nearest",
                behavior: "smooth",
              });
          }
        }
        // Update count label
        const cnt = document.getElementById("cat-cnt");
        if (cnt)
          cnt.textContent =
            q && _vsMatches.length
              ? `${_vsMatches.length} / ${tasks.length} MATCHES`
              : tasks.length
                ? tasks.length + " TASKS"
                : "NO TASKS";
      }

      function renderTaskList(cat) {
        _vsCat = cat;
        focusTaskIdx = -1;
        _vsQuery = "";
        _vsMatches = [];
        renderRows();
      }

      // Simple flat render — no virtual scroll.
      // For 30–200 tasks this is faster than the virtual scroll overhead.
      function renderRows() {
        const el = document.getElementById("task-list");
        if (!el) return;
        el.innerHTML = "";

        if (!_vsCat || !_vsCat.tasks.length) {
          el.innerHTML = `<div style="font-family:'JetBrains Mono',monospace;color:var(--txd);font-size:.74rem;padding:22px;text-align:center;opacity:.45">// NO TASKS IN THIS CATEGORY YET //</div>`;
          return;
        }

        const tasks = _vsCat.tasks;
        const hasSearch = _vsQuery && _vsMatches.length > 0;
        const matchSet = hasSearch ? new Set(_vsMatches) : null;

        tasks.forEach((t, i) => {
          const st = STATUS[`${_vsCat.id}/${t.id}`] || "";
          const dc = diffCls(t.diff);
          const isMatch = !hasSearch || matchSet.has(i);
          const row = document.createElement("div");
          row.className = "task-row" + (i === focusTaskIdx ? " focused" : "");
          if (hasSearch) {
            row.style.opacity = isMatch ? "1" : "0.2";
            if (isMatch) row.style.borderColor = "rgba(0,200,255,.4)";
          }
          row.dataset.idx = i;
          row.innerHTML = `<div class="trow-l">
            <div class="t-dot${st === "ok" ? " ok" : st === "ng" ? " ng" : ""}"></div>
            <div class="t-num">${String(i + 1).padStart(2, "0")}.</div>
            <div><div class="t-id">${t.id.toUpperCase()}</div><div class="t-desc">${t.desc}</div></div>
          </div>
          <div class="stars-wrap"><span class="stars ${dc}">${mkStars(t.diff)}</span><span class="d-lbl">(${t.diff}/10)</span></div>`;
          row.onclick = () => {
            playNav();
            openTask(_vsCat, t);
          };
          el.appendChild(row);
        });
      }

      function mkStars(d) {
        let s = "";
        for (let i = 1; i <= 10; i++) s += i <= d ? "★" : "☆";
        return s;
      }
      function diffCls(d) {
        return d <= 2
          ? "d12"
          : d <= 4
            ? "d34"
            : d <= 6
              ? "d56"
              : d <= 8
                ? "d78"
                : "d910";
      }
      document.getElementById("bk-cat").onclick = (e) => {
        e.stopPropagation();
        playClick();
        navStack.pop();
        if (navStack.length) {
          openCat(navStack[navStack.length - 1]);
        } else {
          clearQueryParams();
          showView("home");
        }
      };

      // ═══════════ TASK ═══════════
      async function openTask(cat, task) {
        curTask = task;
        // Sync URL — uses task.id as the task param (stable, matches config)
        setQueryParams({ cat: cat.id, task: task.id });
        // Ensure cat is on the navStack
        if (!navStack.length || navStack[navStack.length - 1] !== cat) {
          navStack.push(cat);
        }
        curTab = "ed";
        // Strict: lock if task.strict===true
        _strictLocked = task.strict === true;
        if (_strictLocked) _strictOn = true;
        updateStrictUI();
        // Font size
        applyFZ();
        document.getElementById("breadc").innerHTML =
          `<span>${cat.name}</span> <span style="color:var(--txd)">/</span> <span class="act">${task.id.toUpperCase()}</span>`;
        setTabs("ed");
        hideSolOverlay();
        clearResults();
        setStatus("⟳ Loading…");
        showView("task");
        _editorLoading = true;
        if (editor) {
          editor.setValue("// Loading…");
          editor.updateOptions({ readOnly: true });
        }
        const files = await loadTask(cat, task);
        _editorLoading = false;
        const key = `${cat.id}/${task.id}`;
        solCode = CODE[key] !== undefined ? CODE[key] : files.code;
        if (editor) {
          editor.setValue(solCode);
          editor.updateOptions({ readOnly: false });
          editor.focus();
        }
        setStatus("");
      }
      function setTabs(t) {
        document.getElementById("tab-ed").classList.toggle("on", t === "ed");
        document.getElementById("tab-sp").classList.toggle("on", t === "sp");
        document.getElementById("tab-sol").classList.toggle("on", t === "sol");
      }
      function switchTab(t) {
        playClick();
        curTab = t;
        setTabs(t);
        hideSolOverlay();
        if (!editor || !curTask) return;
        const files = FILECACHE[`${curCat().id}/${curTask.id}`];
        _editorLoading = true;
        if (t === "ed") {
          editor.setValue(solCode);
          editor.updateOptions({ readOnly: false });
          editor.focus();
        } else if (files) {
          editor.setValue(files.spec || "// spec not loaded");
          editor.updateOptions({ readOnly: true });
        }
        _editorLoading = false;
      }
      function hideSolOverlay() {
        document.getElementById("sol-overlay").classList.remove("show");
      }
      function requestSolutions() {
        playClick();
        if (!curTask) return;
        document.getElementById("modal").classList.remove("hide");
      }
      function closeModal() {
        playClick();
        document.getElementById("modal").classList.add("hide");
      }
      function doShowSolution() {
        playClick();
        closeModal();
        const files = FILECACHE[`${curCat().id}/${curTask.id}`];
        setTabs("sol");
        document.getElementById("sol-code").textContent =
          files?.sol ||
          "// No reference solution available.\n// Run build.sh to generate task files.";
        document.getElementById("sol-note").textContent = files?.sol
          ? `// grid/${curTask._folder || curCat().folder}/${curTask.file}.sol.js`
          : "";
        document.getElementById("sol-overlay").classList.add("show");
      }
      document.getElementById("bk-task").onclick = () => {
        playClick();
        if (editor && curTask && !_editorLoading) {
          solCode = editor.getValue();
          CODE[`${curCat().id}/${curTask.id}`] = solCode;
        }
        // Return to category URL (drop task param)
        const cat = curCat();
        if (cat) setQueryParams({ cat: cat.id });
        closeMobResults();
        hideSolOverlay();
        showView("category");
      };
      document.getElementById("modal").addEventListener("click", (e) => {
        if (e.target === e.currentTarget) closeModal();
      });

      // ═══════════ MONACO — DARK SOLARIZED ═══════════
      require.config({ paths: { vs: "assets/monaco/vs" } });

      // ── Editor bracket-match palette (change these to restyle paired brackets) ──
      const BRACKET_BG = "rgba(0,160,200,.18)"; // match-highlight fill
      const BRACKET_BORDER = "#0099bb"; // match-highlight border
      // Bracket pair colorization levels (foreground on the bracket chars themselves)
      const BRACKET_L1 = "#00aacc"; // level 1 — cyan
      const BRACKET_L2 = "#2aa198"; // level 2 — teal
      const BRACKET_L3 = "#268bd2"; // level 3 — blue
      const BRACKET_L4 = "#6c71c4"; // level 4 — indigo (solarized violet)
      const BRACKET_L5 = "#00aacc"; // level 5 — repeat cycle
      const BRACKET_L6 = "#2aa198"; // level 6 — repeat cycle

      require(["vs/editor/editor.main"], function () {
        monaco.editor.defineTheme("solarized-dark", {
          base: "vs-dark",
          inherit: false,
          rules: [
            { token: "", foreground: "839496", background: "002b36" },
            { token: "keyword", foreground: "859900", fontStyle: "bold" },
            { token: "keyword.operator", foreground: "657b83" },
            { token: "string", foreground: "2aa198" },
            { token: "string.escape", foreground: "cb4b16" },
            { token: "comment", foreground: "586e75", fontStyle: "italic" },
            { token: "number", foreground: "d33682" },
            { token: "regexp", foreground: "cb4b16" },

        // Init font size + strict UI
        applyFZ();
